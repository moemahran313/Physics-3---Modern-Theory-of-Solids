    <script>
      // Filter benign Vite HMR websocket disconnection log in AI Studio environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite] failed to connect to websocket') !== -1 || firstArg.indexOf('vite-plugin-pwa:dev-ready') !== -1)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
